name = "constellation-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"

# 비밀 값이 아닌 설정만 여기에 둔다.
[vars]
# Claude 모델. 품질 비교 후 claude-sonnet-5-5 등으로 바꿀 수 있다.
CLAUDE_MODEL = "claude-haiku-5-5"
# 응답 깊이(low | medium | high). 낮을수록 빠르다. 앱 타임아웃이 10초라 low로 시작한다.
CLAUDE_EFFORT = "low"
# Claude 호출 제한 시간(ms). 앱의 10초 타임아웃보다 짧게 둔다.
CLAUDE_TIMEOUT_MS = "9000"
# 기기당 분당 호출 횟수. 기기 테스트 후 조정.
RATE_LIMIT_PER_MINUTE = "6"
# 낭독(Google Cloud TTS) 음성과 속도. 음성 이름은 Google 음성 목록에서 확인한다.
TTS_VOICE = "ko-KR-Chirp3-HD-Despina"
# 0.5~1.5. "0"이면 속도를 보내지 않는다(Chirp 3 HD가 속도 조절을 받지 않으면 0으로).
TTS_SPEAKING_RATE = "0"
# 결과 카드 보관 기간(일)
CARD_TTL_DAYS = "30"

# 결과 카드(QR) 저장소(KV 네임스페이스 constellation-cards).
# 연결하지 않으면 카드 없이 체험이 끝난다.
[[kv_namespaces]]
binding = "CARDS"
id = "51f95c7e31af484c8878b19a7956e844"

# 시크릿은 이 파일에 적지 않는다. 아래 명령으로 등록한다.
#   npx wrangler secret put ANTHROPIC_API_KEY   <- Anthropic 콘솔에서 발급한 API 키
#   npx wrangler secret put APP_SHARED_TOKEN    <- 앱과 공유하는 임의의 긴 문자열
#   npx wrangler secret put ADMIN_PASSWORD     <- 운영자 페이지(/admin) 비밀번호
#   npx wrangler secret put GOOGLE_TTS_API_KEY <- Google Cloud 콘솔에서 발급한 API 키(낭독용)
# 로컬 실행용 값은 .dev.vars에 둔다(.dev.vars.example 참고, 커밋 금지).
