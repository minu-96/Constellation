name = "constellation-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"

# 비밀 값이 아닌 설정만 여기에 둔다.
[vars]
# Claude 모델. 품질 비교 후 claude-sonnet-5-5 등으로 바꿀 수 있다.
CLAUDE_MODEL = "claude-haiku-5-5"
# 응답 깊이(low | medium | high). 낮을수록 빠르다. 앱 타임아웃이 10초라 low로 시작한다.
CLAUDE_EFFORT = "low"
# Claude 호출 제한 시간(ms). 앱의 10초 타임아웃보다 짧게 둔다.
CLAUDE_TIMEOUT_MS = "9000"
# 기기당 분당 호출 횟수. 기기 테스트 후 조정.
RATE_LIMIT_PER_MINUTE = "6"

# 시크릿은 이 파일에 적지 않는다. 아래 명령으로 등록한다.
#   npx wrangler secret put ANTHROPIC_API_KEY   <- Anthropic 콘솔에서 발급한 API 키
#   npx wrangler secret put APP_SHARED_TOKEN    <- 앱과 공유하는 임의의 긴 문자열
# 로컬 실행용 값은 .dev.vars에 둔다(.dev.vars.example 참고, 커밋 금지).
